<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>過去のレポート | InvestNews Japan</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#09090b">
</head>

<body>
  <header class="site-header" style="top:0;">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">IN</div>
        <div>
          <h1><a href="index.html" style="color:inherit;text-decoration:none;">Invest<span>News</span>
              Japan</a></h1>
        </div>
      </div>
    </div>
  </header>
  <main class="main-content">
    <section class="section">
      <div class="section-header">
        <div class="section-icon">📚</div>
        <h2>過去のレポートアーカイブ</h2>
      </div>
      <div id="archiveList" class="macro-content">
        <div class="loading">
          <div class="spinner"></div>
          <div class="loading-text">読み込み中...</div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links"><a href="index.html">トップ</a><a href="disclaimer.html">免責事項</a></div>
      <div class="footer-copy">&copy; 2026 InvestNews Japan.</div>
    </div>
  </footer>
  <script>
    async function loadArchive() {
      const el = document.getElementById("archiveList");
      try {
        const resp = await fetch("data/index.json");
        if (!resp.ok) throw new Error("No index");
        const dates = await resp.json();
        if (!dates.length) { el.innerHTML = "<p style='color:var(--text-muted);padding:20px;'>レポートはまだありません。</p>"; return; }
        el.innerHTML = `<ul style="list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0;">
          ${dates.map(d => `<li><a href="index.html?date=${d}" style="display:block;padding:14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--accent);font-family:var(--mono);text-decoration:none;text-align:center;transition:all 0.2s;font-size:14px;"
          onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">${d}</a></li>`).join("")}
        </ul>`;
      } catch (e) { el.innerHTML = "<p style='color:var(--text-muted);padding:20px;'>レポートはまだありません。バックエンドを実行してください。</p>"; }
    }
    document.addEventListener("DOMContentLoaded", loadArchive);
  </script>
</body>

</html>
